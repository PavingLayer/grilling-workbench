name: Publish npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published GitHub release tag (for example v0.3.0)
        required: true
        type: string
      dry_run:
        description: Validate the release without uploading or publishing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'PavingLayer/grilling-workbench' &&
      ((github.event_name == 'release' && !github.event.release.prerelease) ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Validate the published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          assert.match(process.env.RELEASE_TAG, /^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/);
          JS
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease,assets > "$RUNNER_TEMP/release.json"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const release = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/release.json`));
          assert.equal(release.tagName, process.env.RELEASE_TAG);
          assert.equal(release.isDraft, false);
          assert.equal(release.isPrerelease, false);
          JS

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install an npm CLI with trusted publishing support
        run: npm install --global npm@11.19.1

      - name: Check package identity and tag
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json'));
          assert.equal(pkg.name, 'grilling-workbench');
          assert.equal(`v${pkg.version}`, process.env.RELEASE_TAG);
          assert.equal(pkg.repository.url, 'git+https://github.com/PavingLayer/grilling-workbench.git');
          JS

      - name: Verify the tagged source and installed package
        run: |
          npm ci
          npm run check
          npm test
          npm run test:package

      - name: Pack and check npm publication status
        id: package
        run: |
          mkdir -p "$RUNNER_TEMP/npm-release"
          npm pack --pack-destination "$RUNNER_TEMP/npm-release" --json > "$RUNNER_TEMP/pack.json"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync, appendFileSync } from 'node:fs';
          const [pack] = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/pack.json`));
          const release = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/release.json`));
          const response = await fetch(`https://registry.npmjs.org/grilling-workbench/${pack.version}`, { signal: AbortSignal.timeout(15000) });
          let published = false;
          if (response.ok) {
            const existing = await response.json();
            assert.equal(existing.dist.integrity, pack.integrity, 'This npm version already exists with a different archive.');
            published = true;
          } else assert.equal(response.status, 404, 'Could not check the npm registry.');
          const outputs = {
            archive: `${process.env.RUNNER_TEMP}/npm-release/${pack.filename}`,
            filename: pack.filename,
            integrity: pack.integrity,
            version: pack.version,
            published,
            attached: release.assets.some(asset => asset.name === pack.filename),
          };
          for (const [key, value] of Object.entries(outputs)) appendFileSync(process.env.GITHUB_OUTPUT, `${key}=${value}\n`);
          JS

      - name: Compare an existing GitHub archive with the verified build
        if: steps.package.outputs.attached == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
          FILENAME: ${{ steps.package.outputs.filename }}
        run: |
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$FILENAME" --dir "$RUNNER_TEMP/github-release"
          cmp "$ARCHIVE" "$RUNNER_TEMP/github-release/$FILENAME"

      - name: Check the publish command without publishing
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        env:
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: npm publish "$ARCHIVE" --access public --dry-run

      - name: Attach the verified archive to GitHub
        if: >-
          steps.package.outputs.attached != 'true' &&
          (github.event_name == 'release' || !inputs.dry_run)
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: gh release upload "$RELEASE_TAG" "$ARCHIVE" --repo "$GITHUB_REPOSITORY"

      - name: Publish to npm using OIDC
        if: >-
          steps.package.outputs.published != 'true' &&
          (github.event_name == 'release' || !inputs.dry_run)
        env:
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: npm publish "$ARCHIVE" --access public

      - name: Verify the public npm archive
        if: github.event_name == 'release' || !inputs.dry_run
        env:
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
          PACKAGE_INTEGRITY: ${{ steps.package.outputs.integrity }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const url = `https://registry.npmjs.org/grilling-workbench/${process.env.PACKAGE_VERSION}`;
          const response = await fetch(url, { signal: AbortSignal.timeout(30000) });
          assert.equal(response.status, 200, 'The published npm version is not available.');
          assert.equal((await response.json()).dist.integrity, process.env.PACKAGE_INTEGRITY);
          console.log(`Verified grilling-workbench@${process.env.PACKAGE_VERSION}`);
          JS
